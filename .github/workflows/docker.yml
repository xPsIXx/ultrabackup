name: Build Docker image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub expressions have no string case functions, so the lowercase
      # owner is computed in bash (run: steps use bash on ubuntu-latest).
      # GHCR repository names must be lowercase; github.repository_owner
      # is "xPsIXx".
      - name: Compute names
        id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.vars.outputs.owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/ultrabackup:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/ultrabackup:${{ steps.vars.outputs.version }}
